# ═══════════════════════════════════════════════════════════════════════════════
# GAMING
# ═══════════════════════════════════════════════════════════════════════════════
# Catch almost all Wine/Proton game processes before they land in a tile.
# force_tearing:1 here covers every Steam/Proton game broadly (on top of the
# named-game rules with the same flag in 30-tags.conf, and the global
# allow_tearing=2 fullscreen-only default in 80-layout-and-monitors.conf).
window_rule=is_floating:1,force_tearing:1,app_id:^steam_app_.*$
window_rule = is_floating:1, app_id:[Ss]team
window_rule = is_floating:0, title:Steam
window_rule = is_floating:1, app_id:steam, title:Steam Settings
# vkcube is the standard tearing test tool — run it and look for a visible
# tear line while moving the cube if you want to confirm tearing is active.
window_rule=force_tearing:1,title:^vkcube$
window_rule=is_floating:1,title:^(EA|Origin)$
window_rule=is_floating:1,app_id:^com\.heroicgameslauncher\.hgl$
window_rule=is_floating:1,title:^Heroic Games Launcher$
window_rule=is_floating:1,title:^Rockstar Games Launcher$
window_rule=is_floating:1,title:^Battle\.net$
window_rule=is_floating:1,title:^Riot Client$
# Total fallback: catch raw unmanaged Wine windows
window_rule=is_floating:1,title:^Wine.*$
window_rule=is_floating:1,title:^Ubisoft Connect$
window_rule=is_floating:1,app_id:^protonup-qt$

